name: Privacy AI Android Build

on:
  push:
    branches: [ "feature/privacy-ai-android" ]
    paths:
      - "privacy-ai/**"
      - ".github/workflows/privacy-ai-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: privacy-ai
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privacy-ai-debug-apk
          path: privacy-ai/app/build/outputs/apk/debug/app-debug.apk
